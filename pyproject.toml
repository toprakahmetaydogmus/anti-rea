[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anti-rea"
version = "1.0.0"
description = "Military-grade defense engine against AI-driven automated reverse engineering (Anti-REA)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Toprak Ahmet Aydoğmuş", email = "siberakademi@org.tr" }
]
keywords = ["security", "reverse-engineering", "anti-rea", "llm-defense", "ast-obfuscation", "ai-guard"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Code Generators"
]

[project.scripts]
anti-rea = "anti_rea.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["anti_rea*"]
